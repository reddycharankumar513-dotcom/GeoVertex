name: GeoVertex CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-quality-and-test:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geovertex
          POSTGRES_PASSWORD: geovertex_password
          POSTGRES_DB: geovertex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Geospatial Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://geovertex:geovertex_password@localhost:5432/geovertex_db
          DATABASE_URL_SYNC: postgresql+psycopg://geovertex:geovertex_password@localhost:5432/geovertex_db
          JWT_SECRET: ci-test-secret-key-geovertex-development-2026-strict
          ENVIRONMENT: development
          DEBUG: "true"
        run: |
          cd backend
          alembic upgrade head
          python -m app.seed

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://geovertex:geovertex_password@localhost:5432/geovertex_db
          DATABASE_URL_SYNC: postgresql+psycopg://geovertex:geovertex_password@localhost:5432/geovertex_db
          JWT_SECRET: ci-test-secret-key-geovertex-development-2026-strict
          ENVIRONMENT: test
          DEBUG: "false"
        run: |
          pytest tests/backend -v

      - name: Verify Automated Backup & Restore Scripts
        env:
          DATABASE_URL: postgresql+psycopg://geovertex:geovertex_password@localhost:5432/geovertex_db
          DATABASE_URL_SYNC: postgresql+psycopg://geovertex:geovertex_password@localhost:5432/geovertex_db
        run: |
          python backend/scripts/backup.py --output-dir backend/backups
          BACKUP_FILE=$(ls backend/backups/*.gz | head -n 1)
          python backend/scripts/restore.py --backup-file "$BACKUP_FILE" --verify-only

  frontend-quality-and-build:
    name: Frontend Tests, Typecheck & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Type Checking
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Production Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  container-build-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-and-test, frontend-quality-and-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: geovertex-backend:ci-test

      - name: Build Worker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: geovertex-worker:ci-test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: geovertex-frontend:ci-test
