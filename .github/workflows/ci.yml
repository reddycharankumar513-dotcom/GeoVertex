name: GeoVertex CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geovertex
          POSTGRES_PASSWORD: geovertex_password
          POSTGRES_DB: geovertex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Geospatial System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://geovertex:geovertex_password@localhost:5432/geovertex_db
          JWT_SECRET: test-secret-key-ci-environment-only-2026
        run: |
          cd backend
          alembic upgrade head
          python -m app.seed

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+psycopg://geovertex:geovertex_password@localhost:5432/geovertex_db
          JWT_SECRET: test-secret-key-ci-environment-only-2026
        run: |
          pytest tests/backend -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type Check & Build
        working-directory: ./frontend
        run: npm run build
