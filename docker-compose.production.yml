# ==============================================================================
# GeoVertex Production Docker Compose Configuration
# Production-ready multi-container orchestration with PostGIS, Redis, MinIO,
# FastAPI Backend, Celery Worker, React Frontend, and Hardened Nginx Proxy
# ==============================================================================
version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geovertex_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geovertex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-geovertex_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - geovertex_pgdata:/var/lib/postgresql/data
    networks:
      - geovertex_internal
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geovertex} -d ${POSTGRES_DB:-geovertex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: geovertex_prod_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-geovertex_redis_secret}"]
    volumes:
      - geovertex_redisdata:/data
    networks:
      - geovertex_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-geovertex_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: geovertex_prod_minio
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geovertex_storage_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO password required}
    volumes:
      - geovertex_miniodata:/data
    networks:
      - geovertex_internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: geovertex_prod_backend
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      PROJECT_NAME: "GeoVertex Cadastral Intelligence Platform"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geovertex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geovertex_db}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-geovertex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geovertex_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-geovertex_redis_secret}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Secure JWT_SECRET of at least 32 chars required}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-geovertex-documents}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-geovertex_storage_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_SSL: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://geovertex.gov,https://app.geovertex.gov}
    volumes:
      - geovertex_uploads:/app/backend/uploads
    networks:
      - geovertex_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: geovertex_prod_worker
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geovertex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geovertex_db}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-geovertex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geovertex_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-geovertex_redis_secret}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-geovertex_redis_secret}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-geovertex_redis_secret}@redis:6379/2
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-geovertex-documents}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-geovertex_storage_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_USE_SSL: "false"
    volumes:
      - geovertex_uploads:/app/backend/uploads
    networks:
      - geovertex_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: geovertex_prod_frontend
    restart: always
    networks:
      - geovertex_internal
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: geovertex_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - geovertex_internal
      - geovertex_external
    depends_on:
      - frontend
      - backend

networks:
  geovertex_internal:
    driver: bridge
    internal: true
  geovertex_external:
    driver: bridge

volumes:
  geovertex_pgdata:
  geovertex_redisdata:
  geovertex_miniodata:
  geovertex_uploads:
